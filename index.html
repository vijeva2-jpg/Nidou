const sources='<section class="references"><h2 class="sectiontitle">Sources et repères</h2><ul><li><a href="https://www.insee.fr/" target="_blank" rel="noopener noreferrer">INSEE</a> — démographie et naissances</li><li><a href="https://www.santepubliquefrance.fr/" target="_blank" rel="noopener noreferrer">Santé publique France</a> — santé mentale périnatale</li><li><a href="https://www.cnil.fr/" target="_blank" rel="noopener noreferrer">CNIL</a> — protection des données personnelles</li><li><a href="https://www.economie.gouv.fr/dgccrf" target="_blank" rel="noopener noreferrer">DGCCRF</a> — obligations des plateformes</li><li><a href="https://doulas.info/" target="_blank" rel="noopener noreferrer">Doulas de France</a> — rôle et limites de la doula</li></ul><p class="smallnote">Analyse qualitative de projet, novembre 2026. Les appréciations d’intensité et les hypothèses commerciales ne sont pas issues d’une enquête terrain.</p></section>';
const pages={
home:()=>'<section class="launch" aria-label="Accueil Nidou"><div class="launch-deco deco-cloud cloud-left" aria-hidden="true">☁</div><div class="launch-deco deco-cloud cloud-right" aria-hidden="true">☁</div><div class="launch-deco moon" aria-hidden="true">☾</div><div class="launch-deco star star-one" aria-hidden="true">✦</div><div class="launch-deco star star-two" aria-hidden="true">✳</div><div class="launch-deco star star-three" aria-hidden="true">✧</div><div class="launch-deco teddy" aria-hidden="true">🧸</div><div class="launch-deco flower" aria-hidden="true">✿</div><div class="launch-center"><div class="launch-logo">nidou<span>.</span></div><p class="launch-subtitle">Bien entourés, dès les premiers instants.</p><div class="launch-grid"><a class="launch-button launch-pink" href="#/interface"><span class="launch-button-icon" aria-hidden="true">🧸</span><span>Interface</span><span class="launch-button-arrow" aria-hidden="true"></span></a><a class="launch-button launch-lilac" href="#/swot"><span class="launch-button-icon" aria-hidden="true">🌙</span><span>SWOT</span><span class="launch-button-arrow" aria-hidden="true"></span></a><a class="launch-button launch-yellow" href="#/porter"><span class="launch-button-icon" aria-hidden="true">⭐</span><span>Porter</span><span class="launch-button-arrow" aria-hidden="true"></span></a><a class="launch-button launch-blue" href="#/pestel"><span class="launch-button-icon" aria-hidden="true">☁️</span><span>PESTEL</span><span class="launch-button-arrow" aria-hidden="true"></span></a><a class="launch-button launch-green" href="#/bmc"><span class="launch-button-icon" aria-hidden="true">🌱</span><span>BMC</span><span class="launch-button-arrow" aria-hidden="true"></span></a></div></div><div class="launch-bottom" aria-hidden="true">✧ &nbsp; un projet tout doux &nbsp; ✧</div></section>',
pestel:()=>'<div class="shell page">'+hero('Analyse PESTEL','Les tendances politiques, économiques, socioculturelles, technologiques, environnementales et légales qui influencent le développement de Nidou.','blue','☁','01 / Analyse externe')+'<div class="cards3">'+card('P · Politique · Opportunité','Soutien à la parentalité','Les politiques de santé périnatale renforcent l’attention portée au bien-être des jeunes parents. Nidou doit rester complémentaire du suivi médical.','sky')+card('E · Économique · Menace','Marché sensible au prix','Baisse de la natalité, arbitrages budgétaires et prestations généralement à la charge des familles limitent le marché adressable.','pink')+card('S · Socioculturel · Opportunité','Besoin d’être accompagné','Isolement parental et difficultés vécues pendant le post-partum constituent un besoin potentiel de soutien humain, à valider localement.','lav')+card('T · Technologie · Opportunité','Réservation simplifiée','Profils, disponibilité, paiement et automatisation facilitent la mise en relation à moindre coût opérationnel.','sky')+card('E · Environnement · Mixte','Proximité et déplacements','Interventions à domicile génératrices de déplacements ; géolocalisation et accompagnement à distance peuvent les limiter.','green')+card('L · Légal · Menace','Confiance et conformité','Limites de l’activité non médicale, statut indépendant, RGPD, transparence des plateformes et assurance exigent un cadrage strict.','sun')+'</div><h2 class="sectiontitle">Ce que cela implique pour Nidou</h2><div class="strategy">'+card('01','Rendre l’offre accessible','Formules ponctuelles et forfaits, prix transparents et tests de consentement à payer.')+card('02','Construire la confiance','Vérification des intervenantes, charte claire, avis authentiques et parcours pédagogique.')+card('03','Couverture nationale','Ouverture à l’échelle nationale, avec suivi de la couverture réelle des doulas par bassin de vie.')+'</div>'+sources+'</div>',
porter:()=>'<div class="shell page">'+hero('Les 5 forces de Porter','Comprendre l’attractivité concurrentielle du marché de la mise en relation avec des doulas indépendantes.','purple','⭐','02 / Analyse sectorielle')+'<div class="porter">'+card('Force 1','Nouveaux entrants','<span class="score high">Forte</span><br><br>Création d’un annuaire relativement accessible ; les barrières reposent surtout sur la confiance, l’acquisition et le réseau.','pink')+card('Force 2','Pouvoir des familles','<span class="score high">Fort</span><br><br>Comparaison facile des prestations, forte sensibilité aux prix et possibilité de réserver hors plateforme.','sun')+card('Force 3','Pouvoir des doulas','<span class="score med">Moyen à fort</span><br><br>La qualité du réseau conditionne la valeur du service ; les indépendantes gardent des canaux directs de vente.','lav')+'<article class="card center"><span class="eyebrow" style="color:#e8d8f2">Nidou au centre</span><h3 style="font-size:2rem;margin:10px 0">Rivalité concurrentielle</h3><span class="score med">Moyenne à forte</span><p style="margin-top:15px">Annuaires, réseaux locaux et plateformes spécialisées se disputent la visibilité.</p></article>'+card('Force 4','Services de substitution','<span class="score high">Forte</span><br><br>Aide familiale, accompagnement associatif, services à domicile et professionnels de santé pour les besoins relevant de leur compétence.','sky')+card('Force 5','Intensité de la rivalité','<span class="score med">Moyenne à forte</span><br><br>Marché encore fragmenté, mais acquisition difficile et différenciation indispensable.','green')+'</div><h2 class="sectiontitle">Notre réponse concurrentielle</h2><div class="strategy">'+card('01','Spécialisation post-partum','Développer une offre identifiable plutôt qu’un simple annuaire généraliste.')+card('02','Expérience rassurante','Profils détaillés, réservation claire et accompagnement avant la première mission.')+card('03','Valeur pour les doulas','Outils de gestion utiles et commissions justifiées pour limiter le contournement.')+'</div><p class="smallnote">L’intensité des forces est une estimation pédagogique, non une mesure empirique.</p></div>',
swot:()=>'<div class="shell page">'+hero('Matrice SWOT','Synthèse des atouts internes et des facteurs externes de Nidou, suivie de nos priorités stratégiques.','rose','🌙','03 / Diagnostic stratégique')+'<div class="matrix">'+ '<article class="card green"><span class="tag">S · Strengths</span><h3>Forces</h3><ul><li>Plateforme digitale simple et extensible</li><li>Coûts fixes d’intervention limités grâce aux indépendantes</li><li>Positionnement ciblé sur le post-partum</li><li>Parcours de réservation et paiement intégrés prévus dans le modèle</li></ul></article>'+'<article class="card sun"><span class="tag">W · Weaknesses</span><h3>Faiblesses</h3><ul><li>Marque inconnue au lancement</li><li>Aucun réseau de doulas encore constitué</li><li>Modèle dépendant de commissions et du volume</li><li>Qualité des prestations difficile à standardiser</li></ul></article>'+'<article class="card sky"><span class="tag">O · Opportunities</span><h3>Opportunités</h3><ul><li>Demande potentielle de soutien postnatal</li><li>Digitalisation des services de proximité</li><li>Partenariats avec l’écosystème parentalité</li><li>Marché fragmenté permettant une offre lisible</li></ul></article>'+'<article class="card pink"><span class="tag">T · Threats</span><h3>Menaces</h3><ul><li>Recul du nombre de naissances</li><li>Arbitrages de pouvoir d’achat</li><li>Solutions concurrentes et contournement</li><li>Contraintes légales, données personnelles et réputation</li></ul></article>'+'</div><h2 class="sectiontitle">Du SWOT à l’action</h2><div class="cards2">'+card('SO · Offensive','Développer l’acquisition nationale','Combiner spécialisation post-partum et réservation intégrée pour recruter les premières familles en France.','green')+card('WO · Développement','Construire le réseau','Nouer des partenariats locaux et sélectionner un premier noyau d’intervenantes qualifiées.','sky')+card('ST · Défensive','Gagner la confiance','Prouver la valeur par des profils vérifiés, conditions transparentes et accompagnements bien délimités.','lav')+card('WT · Prudence','Maîtriser le risque','Limiter les investissements initiaux, suivre acquisition et réachat, et encadrer juridiquement la plateforme.','pink')+'</div><div class="ribbon"><h2 style="font-size:2rem">Notre recommandation</h2><p>Lancer la plateforme au niveau national, mais suivre la densité locale de doulas, les réservations réelles et la satisfaction avant d’intensifier l’acquisition dans chaque zone.</p></div></div>',
bmc:()=>"<div class=\"shell page\"><section class=\"pagehero purple\"><span class=\"babydecor\" aria-hidden=\"true\">🌱</span><span class=\"eyebrow\">04 / Modèle économique</span><h1>Business Model Canvas</h1><p>Les neuf piliers du modèle de Nidou : une marketplace nationale qui permet aux familles de rechercher, réserver et régler des prestations de doulas indépendantes.</p></section><div class=\"bmc-intro\"><p><strong>Choix stratégiques du projet :</strong> lancement à l’échelle nationale, réservation et paiement sur Nidou, rémunération par commission sur chaque prestation réglée via la plateforme.</p><span class=\"bmc-note\">Stratégie définie · Projet fictif</span></div><div class=\"bmc-map\" aria-label=\"Les neuf blocs du Business Model Canvas de Nidou\"><section class=\"bmc-block bmc-partners\" aria-labelledby=\"bmc-partners-title\"><span class=\"block-index\">08 / 09</span><h3 id=\"bmc-partners-title\"><span class=\"block-icon\" aria-hidden=\"true\">🤝</span>Partenaires clés</h3><ul><li>Doulas indépendantes réparties sur le territoire national</li><li>Prestataire de services de paiement adapté aux marketplaces (encaissement et reversements)</li><li>Réseaux de sages-femmes, professionnels de la périnatalité et structures d’accueil du jeune enfant (partenariats à construire)</li></ul></section><section class=\"bmc-block bmc-activities\" aria-labelledby=\"bmc-activities-title\"><span class=\"block-index\">07 / 09</span><h3 id=\"bmc-activities-title\"><span class=\"block-icon\" aria-hidden=\"true\">✨</span>Activités clés</h3><ul><li>Recruter, contrôler et référencer les doulas partout en France</li><li>Développer la plateforme de recherche, de réservation et de paiement</li><li>Acquérir des familles et assurer une couverture géographique suffisante</li><li>Gérer demandes, support, annulations, litiges et qualité de service</li></ul></section><section class=\"bmc-block bmc-resources\" aria-labelledby=\"bmc-resources-title\"><span class=\"block-index\">06 / 09</span><h3 id=\"bmc-resources-title\"><span class=\"block-icon\" aria-hidden=\"true\">🧩</span>Ressources clés</h3><ul><li>Plateforme web avec recherche géographique, disponibilités et réservation</li><li>Infrastructure de paiement et de suivi des transactions</li><li>Réseau national de doulas référencées et informations vérifiées</li><li>Marque, équipe produit et gestion sécurisée des données</li></ul></section><section class=\"bmc-block bmc-value\" aria-labelledby=\"bmc-value-title\"><span class=\"block-index\">02 / 09</span><h3 id=\"bmc-value-title\"><span class=\"block-icon\" aria-hidden=\"true\">💗</span>Propositions de valeur</h3><ul><li><strong>Familles :</strong> trouver une doula proche de chez soi, comparer les prestations, réserver et payer depuis un même site</li><li><strong>Doulas :</strong> visibilité auprès de clients partout en France, demandes qualifiées et gestion simplifiée des réservations et règlements</li><li><strong>Confiance :</strong> profils renseignés, prix clairs et rappel du cadre <strong>non médical</strong> de l’accompagnement</li></ul></section><section class=\"bmc-block bmc-relations\" aria-labelledby=\"bmc-relations-title\"><span class=\"block-index\">04 / 09</span><h3 id=\"bmc-relations-title\"><span class=\"block-icon\" aria-hidden=\"true\">💬</span>Relations clients</h3><ul><li>Parcours autonome de recherche et de réservation en ligne</li><li>Notifications et informations de suivi des réservations et paiements</li><li>Assistance en cas de question, modification ou litige</li><li>Collecte d’avis après prestation, sous conditions de modération</li></ul></section><section class=\"bmc-block bmc-channels\" aria-labelledby=\"bmc-channels-title\"><span class=\"block-index\">03 / 09</span><h3 id=\"bmc-channels-title\"><span class=\"block-icon\" aria-hidden=\"true\">📣</span>Canaux</h3><ul><li>Site Nidou accessible depuis toute la France</li><li>SEO national et local (recherches par ville et accompagnement)</li><li>Réseaux sociaux, bouche-à-oreille et campagnes d’acquisition ciblées</li><li>Salons du bébé, de la grossesse et de la parentalité (ex. Salon Baby, salons régionaux)</li><li>Flyers et affiches, avec autorisation, dans les cabinets de sages-femmes, lieux d’accueil de la petite enfance et crèches</li><li>Relais auprès des maternités, PMI, centres de périnatalité, associations de parents et réseaux de doulas</li></ul></section><section class=\"bmc-block bmc-segments\" aria-labelledby=\"bmc-segments-title\"><span class=\"block-index\">01 / 09</span><h3 id=\"bmc-segments-title\"><span class=\"block-icon\" aria-hidden=\"true\">👪</span>Segments de clientèle</h3><ul><li>Futurs parents en France souhaitant un accompagnement non médical</li><li>Jeunes parents recherchant du soutien, notamment après la naissance</li><li>Doulas indépendantes exerçant en France et souhaitant développer leur activité</li></ul></section><section class=\"bmc-block bmc-costs\" aria-labelledby=\"bmc-costs-title\"><span class=\"block-index\">09 / 09</span><h3 id=\"bmc-costs-title\"><span class=\"block-icon\" aria-hidden=\"true\">🧾</span>Structure de coûts</h3><ul><li>Conception, hébergement, sécurité et maintenance de la marketplace</li><li>Marketing national, référencement, participation aux salons et supports d’information imprimés</li><li>Contrôle des profils, service client et gestion des litiges</li><li>Frais de paiement, reversement et conformité applicables aux transactions</li></ul></section><section class=\"bmc-block bmc-revenue\" aria-labelledby=\"bmc-revenue-title\"><span class=\"block-index\">05 / 09</span><h3 id=\"bmc-revenue-title\"><span class=\"block-icon\" aria-hidden=\"true\">💶</span>Sources de revenus</h3><ul><li><strong>Commission prélevée sur chaque prestation réservée et payée via Nidou.</strong></li><li>Revenu dépendant du volume de réservations payantes et du montant des prestations.</li></ul></section></div><div class=\"bmc-bottom\"><article class=\"card\"><span class=\"tag\">Choix retenus</span><h3>Le modèle de Nidou</h3><ul><li><strong>Monétisation :</strong> commission sur les prestations</li><li><strong>Transaction :</strong> réservation et paiement directement sur Nidou</li><li><strong>Couverture :</strong> lancement national dès l’ouverture, avec une offre dépendante des doulas présentes dans chaque zone</li></ul></article><article class=\"card\"><span class=\"tag\">À préciser et à valider</span><h3>Les enjeux de mise en œuvre</h3><ul><li>Gestion des frais de paiement, des justificatifs et du suivi des transactions</li><li>Annulations, remboursements, calendrier des reversements et rôle du prestataire de paiement</li><li>Densité de doulas par zone, coût d’acquisition national et risque de réservation hors plateforme</li></ul></article></div><p class=\"smallnote\">Le modèle décrit les fonctionnalités envisagées, non celles du prototype actuel. Les profils, réservations et paiements sont fictifs. Les doulas ne se substituent pas aux professionnels de santé.</p></div>",
interface:()=>'<div class="shell page">'+hero('Trouver sa doula, en douceur.','Découvrez le futur parcours de recherche Nidou : une expérience simple, chaleureuse et pensée pour les parents.','yellow','🧸','Prototype utilisateur · Démonstration')+'<span class="demo-label">✦ Prototype fictif — aucune réservation ni paiement réel</span><div class="controls"><label for="city" class="hidden">Ville</label><input id="city" type="search" placeholder="Votre ville (ex. Bordeaux)" value="Bordeaux"><label for="service" class="hidden">Accompagnement</label><select id="service"><option value="all">Tous les accompagnements</option><option value="post">Post-partum</option><option value="pre">Avant naissance</option><option value="both">Avant & après</option></select><button id="filter" class="cta">Rechercher</button></div><p id="count" aria-live="polite"></p><div id="results" class="cards3"></div><div class="ribbon"><h2 style="font-size:2rem">Un accompagnement humain, jamais médical.</h2><p>Les doulas ne remplacent pas les sages-femmes, médecins ou professionnels de santé. Nidou présente ici des profils et des prix entièrement fictifs pour illustrer le projet INSEEC.</p></div></div>'
};
const doulas=[{name:'Camille',area:'Bordeaux',type:'post',label:'Post-partum',price:75,emoji:'🌷',desc:'Écoute, soutien au quotidien et premiers jours avec bébé.'},{name:'Lina',area:'Mérignac',type:'both',label:'Avant & après',price:80,emoji:'🌼',desc:'Préparation pratique et accompagnement des premières semaines.'},{name:'Manon',area:'Bordeaux',type:'pre',label:'Avant naissance',price:65,emoji:'🪻',desc:'Échanges, confiance et organisation de l’arrivée du bébé.'},{name:'Julie',area:'Pessac',type:'post',label:'Post-partum',price:70,emoji:'☁️',desc:'Présence rassurante et aide à l’organisation familiale.'},{name:'Sarah',area:'Talence',type:'both',label:'Avant & après',price:85,emoji:'🌙',desc:'Accompagnement personnalisé au rythme de la famille.'},{name:'Emma',area:'Bordeaux',type:'post',label:'Post-partum',price:75,emoji:'🧸',desc:'Temps d’écoute et soutien pratique après la naissance.'}];
function renderProfiles(){const el=document.getElementById('results');if(!el)return;const city=document.getElementById('city').value.trim().toLowerCase(),service=document.getElementById('service').value;const area=city==='bordeaux'||city==='bordeaux métropole'||!city;const filtered=doulas.filter(d=>(area||d.area.toLowerCase().includes(city))&&(service==='all'||d.type===service||(service==='post'&&d.type==='both')||(service==='pre'&&d.type==='both')));document.getElementById('count').textContent=filtered.length+' profil'+(filtered.length>1?'s':'')+' de démonstration';el.innerHTML=filtered.map((d,i)=>'<article class="card"><div class="profile"><span class="avatar">'+d.emoji+'</span><div><h3>'+d.name+'</h3><p>📍 '+d.area+' · '+d.label+'</p><p>'+d.desc+'</p><p class="price">À partir de '+d.price+' € / séance</p><button class="cta" data-profile="'+d.name+'">Voir le profil ↗</button></div></div></article>').join('')||'<div class="card"><h3>Aucun résultat dans cette démo</h3><p>Essayez Bordeaux ou sélectionnez tous les accompagnements.</p></div>';el.querySelectorAll('[data-profile]').forEach(b=>b.addEventListener('click',()=>showProfile(b.dataset.profile)));}
function showProfile(name){const d=doulas.find(x=>x.name===name);if(!d)return;const modal=document.createElement('div');modal.className='modalback';modal.innerHTML='<section class="modal" role="dialog" aria-modal="true" aria-labelledby="profile-title"><button class="close" aria-label="Fermer">×</button><span class="demo-label">Profil fictif</span><div style="font-size:2.5rem">'+d.emoji+'</div><h2 id="profile-title" style="font-size:2.5rem;margin:12px 0">'+d.name+'</h2><p>📍 '+d.area+' · '+d.label+'</p><p>'+d.desc+'</p><p><strong>Tarif indicatif : '+d.price+' € / séance</strong></p><p>Dans la version finale, vous pourrez consulter les disponibilités et demander un rendez-vous. Cette démonstration ne collecte aucune donnée.</p><button class="cta close2">Compris</button></section>';document.body.append(modal);const close=()=>{modal.remove();document.removeEventListener('keydown',esc)};const esc=e=>{if(e.key==='Escape')close()};document.addEventListener('keydown',esc);modal.querySelector('.close').onclick=close;modal.querySelector('.close2').onclick=close;modal.addEventListener('click',e=>{if(e.target===modal)close()});modal.querySelector('.close').focus();}
function route(){const path=location.hash.replace(/^#\/?/,'').split('?')[0]||'home';const key=pages[path]?path:'home';document.body.classList.toggle('is-home',key==='home');app.innerHTML=pages[key]();document.querySelectorAll('[data-nav]').forEach(a=>a.classList.toggle('active',a.dataset.nav===key));document.title=(key==='home'?'Nidou':key.toUpperCase()+' — Nidou')+' | Bien entourés';window.scrollTo({top:0,behavior:'instant'});if(key==='interface'){renderProfiles();document.getElementById('filter').onclick=renderProfiles;document.getElementById('service').onchange=renderProfiles;document.getElementById('city').onkeydown=e=>{if(e.key==='Enter')renderProfiles()};}}
window.addEventListener('hashchange',route);route();
</script></body></html>
